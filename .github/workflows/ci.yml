name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ICMS-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ICMS-backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - uses: actions/cache@v4
        with:
          path: ICMS-backend/.mvn/apache-maven-3.9.6
          key: ${{ runner.os }}-maven-dist-3.9.6

      - name: Unit Test
        run: chmod +x mvnw && ./mvnw test -B

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: ICMS-backend/target/surefire-reports/

  backend-it:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ICMS-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ICMS-backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - uses: actions/cache@v4
        with:
          path: ICMS-backend/.mvn/apache-maven-3.9.6
          key: ${{ runner.os }}-maven-dist-3.9.6

      - name: Integration Test
        run: chmod +x mvnw && ./mvnw verify -B

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-it-report
          path: ICMS-backend/target/failsafe-reports/

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ICMS-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ICMS-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: Build
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ICMS-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ICMS-frontend/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ICMS-frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Mock Test
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ICMS-frontend/test-results/

  frontend-e2e-real:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: icms
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_URL: jdbc:mysql://localhost:3306/icms?useSSL=false&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: test123
      JWT_SECRET_KEY: ci-e2e-secret-key-do-not-use-in-production
      ICMS_CAPTCHA_ENABLED: false
      REFRESH_TOKEN_SECURE: false
    defaults:
      run:
        working-directory: ICMS-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ICMS-backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - uses: actions/cache@v4
        with:
          path: ICMS-backend/.mvn/apache-maven-3.9.6
          key: ${{ runner.os }}-maven-dist-3.9.6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ICMS-frontend/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ICMS-frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Frontend Deps
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for MySQL & Start Backend
        run: |
          cd ../ICMS-backend
          chmod +x mvnw
          ./mvnw spring-boot:run -B &
          for i in $(seq 1 45); do
            curl -s http://localhost:8080/api/auth/captcha > /dev/null 2>&1 && break
            sleep 2
          done

      - name: E2E Real Test
        run: npx playwright test --config e2e/playwright.real.config.js --reporter=line

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-real-screenshots
          path: ICMS-frontend/test-results/
  test-document:
    runs-on: ubuntu-latest
    needs:
      - backend
      - backend-it
      - frontend-unit
      - frontend-e2e
      - frontend-e2e-real
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Upload Test Cases Document
        uses: actions/upload-artifact@v4
        with:
          name: test-cases-document
          path: docs/TEST_CASES.md
          if-no-files-found: error
