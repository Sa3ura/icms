server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.208.128:3306/icms?useSSL=false&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ***REMOVED***

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    clean-disabled: true
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启下划线转驼峰
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl # Log4j2 输出 SQL
  global-config:
    db-config:
      id-type: auto # 主键自增
      logic-delete-field: deleted # 逻辑删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值

sa-token:
  token-name: Authorization
  timeout: 1800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  token-prefix: ""
  is-log: true
  is-print: false
  jwt-secret-key: ***REMOVED_JWT_SECRET***

icms:
  refresh-token:
    cookie-name: icms_rf
    max-age: 604800
    path: /api
    http-only: true
    same-site: Strict
