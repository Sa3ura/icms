server:
  port: 8080
  servlet:
    context-path: /

spring:
  # 本地开发时从 application-local.yml 读取真实密钥（该文件已 gitignore，不会提交）；
  # 用 classpath: 从 resources 加载，不受启动工作目录影响（file:./ 会因工作目录不同而找不到）。
  # 生产环境改用同名环境变量注入。optional: 表示文件不存在也不报错。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/icms?useSSL=false&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    clean-disabled: true
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启下划线转驼峰
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl # Log4j2 输出 SQL
  global-config:
    db-config:
      id-type: auto # 主键自增
      logic-delete-field: deleted # 逻辑删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值

sa-token:
  token-name: Authorization
  timeout: 1800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  token-prefix: ""
  is-log: true
  is-print: false
  jwt-secret-key: ${JWT_SECRET_KEY:}

icms:
  refresh-token:
    cookie-name: icms_rf
    max-age: 604800
    path: /api
    http-only: true
    same-site: Strict
    secure: ${REFRESH_TOKEN_SECURE:false}

# Knife4j API 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
